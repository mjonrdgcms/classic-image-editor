# Builds the macOS and Linux apps (and runs the browser checks in WebKit, the
# engine both of them use). Runs on pushes to desktop-builds, on version tags,
# and by hand from the Actions tab. The finished apps are attached to each run
# as downloadable artifacts.
name: Desktop builds

on:
  push:
    branches: [desktop-builds]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple silicon + Intel)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Build the universal app and disk image
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Collect the app
        run: |
          set -e
          B=src-tauri/target/universal-apple-darwin/release/bundle
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "$B"/dmg/*.dmg "out/Classic Image Editor $V (macOS).dmg"
          # A zip of the .app, for people who'd rather not mount a disk image.
          ditto -c -k --keepParent "$B/macos/Classic Image Editor.app" "out/Classic Image Editor $V (macOS app).zip"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error
      # The browser checks in Safari's engine on a real Mac (WebGL2 through Metal).
      - name: WebKit checks
        continue-on-error: true
        run: |
          npx playwright install webkit
          E2E_BROWSER=webkit npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-webkit-screenshots
          path: e2e/out-webkit/
          if-no-files-found: ignore

  linux:
    name: Linux (deb, rpm, AppImage)
    # Built on the oldest supported Ubuntu so the packages run on older systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - run: npm ci
      - run: npm test
      - name: Build the packages
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Collect the packages
        run: |
          set -e
          B=src-tauri/target/release/bundle
          mkdir -p out
          cp "$B"/deb/*.deb "$B"/rpm/*.rpm "$B"/appimage/*.AppImage out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error
